<!doctype html>
<html lang="ru" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#16131e"><title>PowerTechStore — игровые ПК в Уфе</title><script>

<body>

<header><div class="wrap nav"><a class="brand" href="#" aria-label="PowerTechStore, в начало"><svg class="brand-pc" viewBox="0 0 36 40" aria-hidden="true"><path fill="#30293e" stroke="#d2bcff" d="m2 7 11-5 20 4v27l-11 5-20-4z"/><path fill="none" stroke="#9a89b2" d="m2 7 20 4 11-5m-11 5v27M5 27l14 3"/><g fill="none" stroke="#d2bcff" stroke-width="1.7"><ellipse cx="27.5" cy="15" rx="2.7" ry="3.7"/><ellipse cx="27.5" cy="25" rx="2.7" ry="3.7"/><circle cx="11" cy="18" r="4"/></g></svg>PowerTech<span>Store</span></a><a href="#catalog">Каталог</a><span class="city">Уфа</span><button id="theme" type="button" aria-label="Тёмная тема" title="Переключить тему"><span aria-hidden="true">◐</span></button></div></header>

<div class="orbit" role="group" aria-label="Выбор сборки"><div class="orbit-track" aria-hidden="true"></div></div>
</div><div class="entry-action"><a class="action" href="#catalog">Перейти к каталогу</a></div></section>
